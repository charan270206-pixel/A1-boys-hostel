<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- UNION EMBLEM (Geometric Interlocking Rings / C-Union Knot) -->
  <g transform="translate(15, 10)" filter="url(#softGlow)">
    <!-- Outer Shield/Ring Accent -->
    <path d="M 50,15 
             C 72,15 90,33 90,55 
             C 90,68 84,79 74,86 
             L 64,74 
             C 70,69 74,62 74,55 
             C 74,42 63,31 50,31 
             C 37,31 26,42 26,55 
             C 26,68 37,79 50,79 
             L 50,95 
             C 28,95 10,77 10,55 
             C 10,33 28,15 50,15 Z" 
          fill="url(#primaryGrad)" 
          filter="url(#iconShadow)"/>

    <!-- Interlocking Union Loop 2 (Dynamic Product Flow Arc) -->
    <path d="M 50,23 
             C 68,23 82,37 82,55 
             C 82,65 77,74 69,80 
             L 59,70 
             C 64,66 67,61 67,55 
             C 67,46 59,38 50,38 
             L 50,23 Z" 
          fill="url(#accentGrad)" 
          opacity="0.95"/>

    <!-- Central Hexagonal Product Core (Symbolizing Management & Inventory) -->
    <g transform="translate(50, 55)">
      <!-- Hexagon Node -->
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#FFFFFF" filter="url(#iconShadow)"/>
      <polygon points="0,-13 11,-6 11,6 0,13 -11,6 -11,-6" fill="url(#primaryGrad)"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Dynamic Orbiting Union Connectors -->
    <circle cx="50" cy="15" r="4" fill="#06B6D4"/>
    <circle cx="74" cy="86" r="3.5" fill="#4F46E5"/>
    <circle cx="50" cy="95" r="4" fill="#10B981"/>
  </g>

  <!-- TYPOGRAPHY / BRANDING -->
  <g transform="translate(130, 0)">
    <!-- Primary Brand Name: CHARAN -->
    <text x="0" y="58" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#textGrad)">CHARAN</text>

    <!-- Accent Dot / Badge -->
    <rect x="238" y="44" width="8" height="8" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle: PRODUCTS MANAGEMENT SYSTEM -->
    <text x="1" y="80" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="5.5" 
          fill="#64748B">PRODUCTS MANAGEMENT SYSTEM</text>

    <!-- Modern Divider Line with Gradient Accent -->
    <line x1="1" y1="92" x2="335" y2="92" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1" y1="92" x2="80" y2="92" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
