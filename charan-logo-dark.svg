<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="darkPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="darkAccentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- UNION EMBLEM -->
  <g transform="translate(15, 10)" filter="url(#darkGlow)">
    <!-- Interlocking C-Loop Outer -->
    <path d="M 50,15 
             C 72,15 90,33 90,55 
             C 90,68 84,79 74,86 
             L 64,74 
             C 70,69 74,62 74,55 
             C 74,42 63,31 50,31 
             C 37,31 26,42 26,55 
             C 26,68 37,79 50,79 
             L 50,95 
             C 28,95 10,77 10,55 
             C 10,33 28,15 50,15 Z" 
          fill="url(#darkPrimaryGrad)"/>

    <!-- Interlocking Inner Arc -->
    <path d="M 50,23 
             C 68,23 82,37 82,55 
             C 82,65 77,74 69,80 
             L 59,70 
             C 64,66 67,61 67,55 
             C 67,46 59,38 50,38 
             L 50,23 Z" 
          fill="url(#darkAccentGrad)" 
          opacity="0.95"/>

    <!-- Central Hexagonal Core -->
    <g transform="translate(50, 55)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0F172A"/>
      <polygon points="0,-13 11,-6 11,6 0,13 -11,6 -11,-6" fill="url(#darkPrimaryGrad)"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Glowing Nodes -->
    <circle cx="50" cy="15" r="4" fill="#38BDF8"/>
    <circle cx="74" cy="86" r="3.5" fill="#818CF8"/>
    <circle cx="50" cy="95" r="4" fill="#34D399"/>
  </g>

  <!-- TYPOGRAPHY / BRANDING -->
  <g transform="translate(130, 0)">
    <!-- Primary Brand Name: CHARAN -->
    <text x="0" y="58" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#F8FAFC">CHARAN</text>

    <!-- Accent Dot / Badge -->
    <rect x="238" y="44" width="8" height="8" rx="2" fill="url(#darkAccentGrad)"/>

    <!-- Subtitle: PRODUCTS MANAGEMENT SYSTEM -->
    <text x="1" y="80" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="5.5" 
          fill="#94A3B8">PRODUCTS MANAGEMENT SYSTEM</text>

    <!-- Divider Line -->
    <line x1="1" y1="92" x2="335" y2="92" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1" y1="92" x2="80" y2="92" stroke="url(#darkPrimaryGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
