<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="embGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="embGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <filter id="embGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Union Emblem Centered -->
  <g transform="translate(100, 100) scale(1.1) translate(-50, -55)" filter="url(#embGlow)">
    <!-- Interlocking C Ring Outer -->
    <path d="M 50,15 
             C 72,15 90,33 90,55 
             C 90,68 84,79 74,86 
             L 64,74 
             C 70,69 74,62 74,55 
             C 74,42 63,31 50,31 
             C 37,31 26,42 26,55 
             C 26,68 37,79 50,79 
             L 50,95 
             C 28,95 10,77 10,55 
             C 10,33 28,15 50,15 Z" 
          fill="url(#embGrad1)"/>

    <!-- Interlocking Ribbon Loop -->
    <path d="M 50,23 
             C 68,23 82,37 82,55 
             C 82,65 77,74 69,80 
             L 59,70 
             C 64,66 67,61 67,55 
             C 67,46 59,38 50,38 
             L 50,23 Z" 
          fill="url(#embGrad2)" 
          opacity="0.95"/>

    <!-- Hexagonal Core Node -->
    <g transform="translate(50, 55)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0F172A"/>
      <polygon points="0,-13 11,-6 11,6 0,13 -11,6 -11,-6" fill="url(#embGrad1)"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Connectors -->
    <circle cx="50" cy="15" r="4.5" fill="#38BDF8"/>
    <circle cx="74" cy="86" r="4" fill="#818CF8"/>
    <circle cx="50" cy="95" r="4.5" fill="#34D399"/>
  </g>
</svg>
